# NetAtlas — Surge
# Import this profile; add your subscription as a policy-path group, then select it in 节点选择.
# Rule resources update independently; private subscriptions stay in your app.

[General]
loglevel = notify
ipv6 = true
allow-wifi-access = false
allow-hotspot-access = false
http-listen = 127.0.0.1:6152
socks5-listen = 127.0.0.1:6153
# Startup resolvers use IP endpoints; encrypted DNS does not depend on Proxy.
dns-server = system, 223.5.5.5
encrypted-dns-server = https://dns.alidns.com/dns-query
# Direct encrypted DNS avoids a resolver -> hostname proxy -> resolver cycle.
encrypted-dns-follow-outbound-mode = false
encrypted-dns-skip-cert-verification = false
udp-policy-not-supported-behaviour = REJECT

[Proxy]
# Add native nodes here, or use the app subscription entry below.

[Proxy Group]
节点选择 = select, REJECT, DIRECT, 自动选择, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点, include-all-proxies=true
自动选择 = url-test, include-all-proxies=true, policy-regex-filter=.+, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
AI服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
