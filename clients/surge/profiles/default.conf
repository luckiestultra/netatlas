# NetAtlas — complete client configuration
# Add private nodes/subscriptions with the local profile command, or the native entry below.
# An unconfigured profile defaults to REJECT; no placeholder endpoint is contacted.

[General]
loglevel = notify
ipv6 = true
allow-wifi-access = false
allow-hotspot-access = false
http-listen = 127.0.0.1:6152
socks5-listen = 127.0.0.1:6153
# Startup resolvers use IP endpoints; encrypted DNS does not depend on Proxy.
dns-server = system, 223.5.5.5
encrypted-dns-server = https://dns.alidns.com/dns-query
# Direct encrypted DNS avoids a resolver -> hostname proxy -> resolver cycle.
encrypted-dns-follow-outbound-mode = false
encrypted-dns-skip-cert-verification = false
udp-policy-not-supported-behaviour = REJECT

[Proxy]
# Native nodes added here are included by Proxy automatically.

[Proxy Group]
Proxy = select, REJECT, DIRECT, include-all-proxies=true
apple-tvplus = select, Proxy, DIRECT
claude = select, Proxy, DIRECT
cursor = select, Proxy, DIRECT
discord = select, Proxy, DIRECT
docker = select, Proxy, DIRECT
gemini = select, Proxy, DIRECT
github-copilot = select, Proxy, DIRECT
gitlab = select, Proxy, DIRECT
groq = select, Proxy, DIRECT
hbo = select, Proxy, DIRECT
huggingface = select, Proxy, DIRECT
jetbrains = select, Proxy, DIRECT
line = select, Proxy, DIRECT
netflix = select, Proxy, DIRECT
npmjs = select, Proxy, DIRECT
openai = select, Proxy, DIRECT
perplexity = select, Proxy, DIRECT
poe = select, Proxy, DIRECT
signal = select, Proxy, DIRECT
slack = select, Proxy, DIRECT
