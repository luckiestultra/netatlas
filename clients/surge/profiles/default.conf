# NetAtlas — Surge
# Import this profile; add your subscription as a policy-path group, then select it in 节点选择.
# Rule resources update independently; private subscriptions stay in your app.

[General]
loglevel = notify
ipv6 = true
allow-wifi-access = false
allow-hotspot-access = false
http-listen = 127.0.0.1:6152
socks5-listen = 127.0.0.1:6153
# Startup resolvers use IP endpoints; encrypted DNS does not depend on Proxy.
dns-server = system, 223.5.5.5
encrypted-dns-server = https://dns.alidns.com/dns-query
# Direct encrypted DNS avoids a resolver -> hostname proxy -> resolver cycle.
encrypted-dns-follow-outbound-mode = false
encrypted-dns-skip-cert-verification = false
udp-policy-not-supported-behaviour = REJECT

[Proxy]
# Add native nodes here, or use the app subscription entry below.

[Proxy Group]
节点选择 = select, REJECT, DIRECT, 自动选择, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点, include-all-proxies=true
自动选择 = url-test, include-all-proxies=true, policy-regex-filter=.+, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
AI服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
苹果服务 = select, DIRECT, 节点选择, 自动选择, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
谷歌服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
微软服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
开发服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
即时通讯 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
游戏平台 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
国外媒体 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
国外网站 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
漏网之鱼 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
香港节点 = url-test, include-all-proxies=true, policy-regex-filter=香港|🇭🇰|[Hh][Oo][Nn][Gg][ _-]?[Kk][Oo][Nn][Gg]|(^|[^A-Za-z])[Hh][Kk]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
台湾节点 = url-test, include-all-proxies=true, policy-regex-filter=台湾|台灣|🇹🇼|[Tt][Aa][Ii][Ww][Aa][Nn]|(^|[^A-Za-z])[Tt][Ww]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
日本节点 = url-test, include-all-proxies=true, policy-regex-filter=日本|东京|東京|大阪|🇯🇵|[Jj][Aa][Pp][Aa][Nn]|[Tt][Oo][Kk][Yy][Oo]|(^|[^A-Za-z])[Jj][Pp]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
韩国节点 = url-test, include-all-proxies=true, policy-regex-filter=韩国|韓國|首尔|首爾|🇰🇷|[Kk][Oo][Rr][Ee][Aa]|[Ss][Ee][Oo][Uu][Ll]|(^|[^A-Za-z])[Kk][Rr]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
新加坡节点 = url-test, include-all-proxies=true, policy-regex-filter=新加坡|狮城|獅城|🇸🇬|[Ss][Ii][Nn][Gg][Aa][Pp][Oo][Rr][Ee]|(^|[^A-Za-z])[Ss][Gg]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
美国节点 = url-test, include-all-proxies=true, policy-regex-filter=美国|美國|🇺🇸|[Uu][Nn][Ii][Tt][Ee][Dd][ -]?[Ss][Tt][Aa][Tt][Ee][Ss]|(^|[^A-Za-z])[Uu][Ss]([Aa])?([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
