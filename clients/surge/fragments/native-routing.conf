# NetAtlas native routing fragment. The default and standalone profiles already enable these conditions.
# Merge into a custom profile after explicit service/domain rules and before static CN CIDRs/final.
# This is a manual merge fragment; do not replace a complete profile with it.
# Country database: bundled MaxMind database with automatic updates enabled.
# ASN database: bundled GeoLite2 ASN and updated with the app; Surge has no separate ASN URL key.
[General]
disable-geoip-db-auto-update = false

[Rule]
RULE-SET,https://raw.githubusercontent.com/luckiestultra/netatlas/main/clients/surge/rules/china-asn.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/luckiestultra/netatlas/main/clients/surge/rules/geoip-cn.list,DIRECT
