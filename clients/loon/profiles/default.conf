# NetAtlas — Loon
# Import this profile; add your subscription in Configuration → Remote Proxy, then select 节点选择.
# Rule resources update independently; private subscriptions stay in your app.

[General]
allow-wifi-access = false
ipv6 = true
dns-server = system, 223.5.5.5
doh-server = https://dns.alidns.com/dns-query
# Proxy traffic keeps its domain destination for remote resolution; bootstrap DNS stays direct.

[Proxy]
# Add native nodes here, or use the app subscription entry below.

[Remote Proxy]
# 节点订阅 = https://your-provider.example/subscription
# Add a subscription here or in the app; the filters below discover its nodes.

[Remote Filter]
全部节点 = NameRegex, FilterKey = .+
香港节点筛选 = NameRegex, FilterKey = 香港|🇭🇰|[Hh][Oo][Nn][Gg][ _-]?[Kk][Oo][Nn][Gg]|(^|[^A-Za-z])[Hh][Kk]([^A-Za-z]|$)
台湾节点筛选 = NameRegex, FilterKey = 台湾|台灣|🇹🇼|[Tt][Aa][Ii][Ww][Aa][Nn]|(^|[^A-Za-z])[Tt][Ww]([^A-Za-z]|$)
日本节点筛选 = NameRegex, FilterKey = 日本|东京|東京|大阪|🇯🇵|[Jj][Aa][Pp][Aa][Nn]|[Tt][Oo][Kk][Yy][Oo]|(^|[^A-Za-z])[Jj][Pp]([^A-Za-z]|$)
韩国节点筛选 = NameRegex, FilterKey = 韩国|韓國|首尔|首爾|🇰🇷|[Kk][Oo][Rr][Ee][Aa]|[Ss][Ee][Oo][Uu][Ll]|(^|[^A-Za-z])[Kk][Rr]([^A-Za-z]|$)
新加坡节点筛选 = NameRegex, FilterKey = 新加坡|狮城|獅城|🇸🇬|[Ss][Ii][Nn][Gg][Aa][Pp][Oo][Rr][Ee]|(^|[^A-Za-z])[Ss][Gg]([^A-Za-z]|$)
美国节点筛选 = NameRegex, FilterKey = 美国|美國|🇺🇸|[Uu][Nn][Ii][Tt][Ee][Dd][ -]?[Ss][Tt][Aa][Tt][Ee][Ss]|(^|[^A-Za-z])[Uu][Ss]([Aa])?([^A-Za-z]|$)

[Proxy Group]
节点选择 = select, REJECT, DIRECT, 自动选择, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点, 全部节点
自动选择 = url-test, 全部节点, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
AI服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
苹果服务 = select, DIRECT, 节点选择, 自动选择, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
谷歌服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
微软服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
开发服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
即时通讯 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
游戏平台 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
国外媒体 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
国外网站 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
漏网之鱼 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
香港节点 = url-test, 香港节点筛选, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
台湾节点 = url-test, 台湾节点筛选, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
日本节点 = url-test, 日本节点筛选, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
韩国节点 = url-test, 韩国节点筛选, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
新加坡节点 = url-test, 新加坡节点筛选, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
美国节点 = url-test, 美国节点筛选, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50

[Rule]
FINAL,漏网之鱼

