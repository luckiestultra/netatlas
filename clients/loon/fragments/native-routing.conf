# NetAtlas native routing fragment. The default and standalone profiles already enable these conditions.
# Merge into a custom profile after explicit service/domain rules and before static CN CIDRs/final.
# This is a manual merge fragment; do not replace a complete profile with it.
# Native GeoIP and ASN database URL fields are emitted; keep Loon's database updates enabled.
# ipasn-url requires Loon 3.2.3 (754) or later.
[General]
geoip-url = https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-Country.mmdb
ipasn-url = https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb

[Remote Rule]
https://raw.githubusercontent.com/luckiestultra/netatlas/main/clients/loon/rules/china-asn.list, policy=DIRECT, tag=netatlas-china-asn, enabled=true
https://raw.githubusercontent.com/luckiestultra/netatlas/main/clients/loon/rules/geoip-cn.list, policy=DIRECT, tag=netatlas-geoip-cn, enabled=true
