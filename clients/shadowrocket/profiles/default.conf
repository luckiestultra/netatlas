# NetAtlas — Shadowrocket
# Import this profile in Configuration; add/select your node subscription on Home, then use Rule mode.
# Rule resources update independently; private subscriptions stay in your app.

[General]
dns-server = https://dns.alidns.com/dns-query
direct-dns-server = https://dns.alidns.com/dns-query
fallback-dns-server = system
proxy-dns-server = system, 223.5.5.5
dns-direct-system = false
dns-direct-fallback-proxy = false
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true
udp-policy-not-supported-behaviour = REJECT

[Proxy]
# Add native nodes here, or use the app subscription entry below.

[Proxy Group]
节点选择 = select, PROXY, REJECT, DIRECT, 自动选择, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点, policy-regex-filter=.+
自动选择 = url-test, policy-regex-filter=.+, url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
规则修正 = select, DIRECT, 节点选择, 自动选择, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
AI服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
