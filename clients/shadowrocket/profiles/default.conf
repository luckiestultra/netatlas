微软服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
开发服务 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
即时通讯 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
游戏平台 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
国外媒体 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
国外网站 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
漏网之鱼 = select, 节点选择, 自动选择, DIRECT, 香港节点, 台湾节点, 日本节点, 韩国节点, 新加坡节点, 美国节点
香港节点 = url-test, policy-regex-filter=香港|🇭🇰|[Hh][Oo][Nn][Gg][ _-]?[Kk][Oo][Nn][Gg]|(^|[^A-Za-z])[Hh][Kk]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
台湾节点 = url-test, policy-regex-filter=台湾|台灣|🇹🇼|[Tt][Aa][Ii][Ww][Aa][Nn]|(^|[^A-Za-z])[Tt][Ww]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
日本节点 = url-test, policy-regex-filter=日本|东京|東京|大阪|🇯🇵|[Jj][Aa][Pp][Aa][Nn]|[Tt][Oo][Kk][Yy][Oo]|(^|[^A-Za-z])[Jj][Pp]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
韩国节点 = url-test, policy-regex-filter=韩国|韓國|首尔|首爾|🇰🇷|[Kk][Oo][Rr][Ee][Aa]|[Ss][Ee][Oo][Uu][Ll]|(^|[^A-Za-z])[Kk][Rr]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
新加坡节点 = url-test, policy-regex-filter=新加坡|狮城|獅城|🇸🇬|[Ss][Ii][Nn][Gg][Aa][Pp][Oo][Rr][Ee]|(^|[^A-Za-z])[Ss][Gg]([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
美国节点 = url-test, policy-regex-filter=美国|美國|🇺🇸|[Uu][Nn][Ii][Tt][Ee][Dd][ -]?[Ss][Tt][Aa][Tt][Ee][Ss]|(^|[^A-Za-z])[Uu][Ss]([Aa])?([^A-Za-z]|$), url=https://www.gstatic.com/generate_204, interval=600, tolerance=50
