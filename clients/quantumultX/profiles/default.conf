url-latency-benchmark=香港节点,server-tag-regex=香港|🇭🇰|[Hh][Oo][Nn][Gg][ _-]?[Kk][Oo][Nn][Gg]|(^|[^A-Za-z])[Hh][Kk]([^A-Za-z]|$),check-interval=1800,tolerance=50,alive-checking=false
url-latency-benchmark=台湾节点,server-tag-regex=台湾|台灣|🇹🇼|[Tt][Aa][Ii][Ww][Aa][Nn]|(^|[^A-Za-z])[Tt][Ww]([^A-Za-z]|$),check-interval=1800,tolerance=50,alive-checking=false
url-latency-benchmark=日本节点,server-tag-regex=日本|东京|東京|大阪|🇯🇵|[Jj][Aa][Pp][Aa][Nn]|[Tt][Oo][Kk][Yy][Oo]|(^|[^A-Za-z])[Jj][Pp]([^A-Za-z]|$),check-interval=1800,tolerance=50,alive-checking=false
url-latency-benchmark=韩国节点,server-tag-regex=韩国|韓國|首尔|首爾|🇰🇷|[Kk][Oo][Rr][Ee][Aa]|[Ss][Ee][Oo][Uu][Ll]|(^|[^A-Za-z])[Kk][Rr]([^A-Za-z]|$),check-interval=1800,tolerance=50,alive-checking=false
url-latency-benchmark=新加坡节点,server-tag-regex=新加坡|狮城|獅城|🇸🇬|[Ss][Ii][Nn][Gg][Aa][Pp][Oo][Rr][Ee]|(^|[^A-Za-z])[Ss][Gg]([^A-Za-z]|$),check-interval=1800,tolerance=50,alive-checking=false
url-latency-benchmark=美国节点,server-tag-regex=美国|美國|🇺🇸|[Uu][Nn][Ii][Tt][Ee][Dd][ -]?[Ss][Tt][Aa][Tt][Ee][Ss]|(^|[^A-Za-z])[Uu][Ss]([Aa])?([^A-Za-z]|$),check-interval=1800,tolerance=50,alive-checking=false

