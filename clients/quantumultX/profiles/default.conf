# NetAtlas — Quantumult X
# Import as a separate configuration. Add your subscription in Nodes > Resources,
# or add native QX node-resource URLs under [server_remote]. No build tool is required.
# Region groups match node names; select a region only when it contains nodes.

[general]
network_check_url=https://www.apple.com/library/test/success.html
server_check_url=https://www.gstatic.com/generate_204
server_check_timeout=5000
fallback_udp_policy=reject
geo_location_checker=http://ipwho.de/json, https://raw.githubusercontent.com/luckiestultra/netatlas/main/clients/quantumultX/scripts/geoip.js

[dns]
# Explicit bootstrap + domestic DoH; local names use system DNS. Proxy resolves its destinations.
server=223.5.5.5
doh-server=https://223.5.5.5/dns-query
server=/localhost/system
server=/local/system
server=/*.local/system
server=/home.arpa/system
server=/*.home.arpa/system

[policy]
static=节点选择,proxy,自动选择,direct,香港节点,台湾节点,日本节点,韩国节点,新加坡节点,美国节点,server-tag-regex=.+
url-latency-benchmark=自动选择,server-tag-regex=.+,check-interval=1800,tolerance=50,alive-checking=false
static=AI服务,节点选择,自动选择,direct,香港节点,台湾节点,日本节点,韩国节点,新加坡节点,美国节点
