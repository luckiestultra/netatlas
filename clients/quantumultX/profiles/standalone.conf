# NetAtlas — complete client configuration
# Proxy defaults to REJECT. Add your own nodes and select them before use.
# DIRECT is an explicit alternative. Rules are inline; no remote rule files are needed.

[general]
network_check_url=https://www.apple.com/library/test/success.html
server_check_url=https://www.gstatic.com/generate_204
server_check_timeout=3000
fallback_udp_policy=reject
# Optional GeoIP display: merge fragments/geoip.conf into this general section.

[dns]
# Bootstrap and direct destinations use explicit DNS. LAN names retain system resolution.
# QX forwards proxy destination hostnames to the selected node for remote resolution.
server=223.5.5.5
doh-server=https://223.5.5.5/dns-query
server=/localhost/system
server=/local/system
server=/*.local/system
server=/home.arpa/system
server=/*.home.arpa/system

[policy]
static=Proxy,reject,direct,server-tag-regex=.+
static=apple-tvplus,Proxy,direct
static=claude,Proxy,direct
static=cursor,Proxy,direct
static=discord,Proxy,direct
static=docker,Proxy,direct
static=gemini,Proxy,direct
