  direct-nameserver-follow-policy: true
  respect-rules: false
proxies: []
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 自动选择
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
    include-all: true
    default-selected: REJECT
  - name: 自动选择
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: .+
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: AI服务
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 苹果服务
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 自动选择
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 谷歌服务
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 微软服务
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 开发服务
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 即时通讯
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 游戏平台
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 国外媒体
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 国外网站
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 漏网之鱼
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - DIRECT
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
  - name: 香港节点
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: 香港|🇭🇰|[Hh][Oo][Nn][Gg][ _-]?[Kk][Oo][Nn][Gg]|(^|[^A-Za-z])[Hh][Kk]([^A-Za-z]|$)
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 台湾节点
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: 台湾|台灣|🇹🇼|[Tt][Aa][Ii][Ww][Aa][Nn]|(^|[^A-Za-z])[Tt][Ww]([^A-Za-z]|$)
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 日本节点
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: 日本|东京|東京|大阪|🇯🇵|[Jj][Aa][Pp][Aa][Nn]|[Tt][Oo][Kk][Yy][Oo]|(^|[^A-Za-z])[Jj][Pp]([^A-Za-z]|$)
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 韩国节点
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: 韩国|韓國|首尔|首爾|🇰🇷|[Kk][Oo][Rr][Ee][Aa]|[Ss][Ee][Oo][Uu][Ll]|(^|[^A-Za-z])[Kk][Rr]([^A-Za-z]|$)
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 新加坡节点
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: 新加坡|狮城|獅城|🇸🇬|[Ss][Ii][Nn][Gg][Aa][Pp][Oo][Rr][Ee]|(^|[^A-Za-z])[Ss][Gg]([^A-Za-z]|$)
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 美国节点
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: 美国|美國|🇺🇸|[Uu][Nn][Ii][Tt][Ee][Dd][ -]?[Ss][Tt][Aa][Tt][Ee][Ss]|(^|[^A-Za-z])[Uu][Ss]([Aa])?([^A-Za-z]|$)
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
