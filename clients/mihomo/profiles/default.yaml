# NetAtlas — standalone profile
# Proxy defaults to REJECT. Add your own nodes and select them before use.
# DIRECT is an explicit alternative. Rules are inline; no remote rule files are needed.

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: true
proxies: []
proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: apple
    type: select
    proxies:
      - DIRECT
      - Proxy
  - name: claude
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: gemini
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: github
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: netflix
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: openai
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: speedtest
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: spotify
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: telegram
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: youtube
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: google
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: microsoft
    type: select
    proxies:
      - Proxy
      - DIRECT
