# NetAtlas — native App configuration with independently updated rule resources.
# Add native nodes or a native subscription in this App/configuration, then select the actual node.
# The client README lists the exact fields; no Node.js or build command is required.
# Region groups require matching node names. Optional rewrites/modules are separate.
mixed-port: 7890
mode: rule
log-level: info
allow-lan: false
bind-address: 127.0.0.1
ipv6: true
dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: redir-host
  ipv6: true
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
  nameserver:
    - https://1.1.1.1/dns-query#节点选择
  nameserver-policy:
    +.home.arpa: system
    +.local: system
    +.localhost: system
    +.lan: system
    rule-set:apple-tvplus:
      - https://1.1.1.1/dns-query#节点选择
    rule-set:claude:
      - https://1.1.1.1/dns-query#节点选择
