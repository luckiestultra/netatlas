name: Sub-Store
description: Optional subscription manager; manual synchronization only. No scheduled task.
author: Peng-YM and Sub-Store contributors
scriptings:
  - http_request:
      name: Sub-Store Core
      match: ^https?:\/\/sub\.store\/((download)|api\/(preview|sync|(utils\/node-info)))
      script_url: https://raw.githubusercontent.com/sub-store-org/Sub-Store/d26e713e38901e02565a6505c1ae5cb8bb8a1a22/sub-store-1.min.js
      body_required: true
      max_size: 999999999
      timeout: 600
      arguments:
        _compat.$argument: "cors=https://sub-store.vercel.app,http://substore.stash,https://substore.stash"
  - http_request:
      name: Sub-Store Simple
      match: ^https?:\/\/sub\.store(?=\/|$)
      script_url: https://raw.githubusercontent.com/sub-store-org/Sub-Store/d26e713e38901e02565a6505c1ae5cb8bb8a1a22/sub-store-0.min.js
      body_required: true
      max_size: 999999999
      timeout: 600
      arguments:
        _compat.$argument: "cors=https://sub-store.vercel.app,http://substore.stash,https://substore.stash"
mitm:
  hostnames:
    includes:
      - sub.store
