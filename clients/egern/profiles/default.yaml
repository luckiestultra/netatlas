  proxy_nameservers: *a1
  skip_tls_verify: false
proxies: []
policy_groups:
  - select:
      name: 节点选择
      policies:
        - REJECT
        - DIRECT
        - 自动选择
        - 香港节点
        - 台湾节点
        - 日本节点
        - 韩国节点
        - 新加坡节点
        - 美国节点
        - 节点订阅
  - auto_test:
      name: 自动选择
      policies:
        - 节点订阅
      flatten: true
      filter: .+
      interval: 600
      tolerance: 50
      latency_test_url: https://www.gstatic.com/generate_204
  - select:
      name: AI服务
      policies:
        - 节点选择
        - 自动选择
        - DIRECT
        - 香港节点
