# NetAtlas — native App configuration with independently updated rule resources.
# Add native nodes or a native subscription in this App/configuration, then select the actual node.
# The client README lists the exact fields; no Node.js or build command is required.
# Region groups require matching node names. Optional rewrites/modules are separate.
# App: edit 节点订阅.urls, then select its actual node under 节点选择.
ipv6: true
allow_external_connections: false
http_port: 3080
socks_port: 3090
dns:
  bootstrap:
    - system
    - 223.5.5.5
  upstreams:
    local:
      - system
    domestic: &a1
      - https://dns.alidns.com/dns-query
    remote:
      - https://1.1.1.1/dns-query
  forward:
    - domain_suffix:
        match: localhost
        value: local
    - domain_suffix:
        match: local
        value: local
    - domain_suffix:
        match: home.arpa
        value: local
    - domain_suffix:
        match: lan
