  - auto_test:
      name: 香港节点
      policies:
        - 节点订阅
      flatten: true
      filter: 香港|🇭🇰|[Hh][Oo][Nn][Gg][ _-]?[Kk][Oo][Nn][Gg]|(^|[^A-Za-z])[Hh][Kk]([^A-Za-z]|$)
      interval: 600
      tolerance: 50
      latency_test_url: https://www.gstatic.com/generate_204
  - auto_test:
      name: 台湾节点
      policies:
        - 节点订阅
      flatten: true
      filter: 台湾|台灣|🇹🇼|[Tt][Aa][Ii][Ww][Aa][Nn]|(^|[^A-Za-z])[Tt][Ww]([^A-Za-z]|$)
      interval: 600
      tolerance: 50
      latency_test_url: https://www.gstatic.com/generate_204
  - auto_test:
      name: 日本节点
      policies:
        - 节点订阅
      flatten: true
      filter: 日本|东京|東京|大阪|🇯🇵|[Jj][Aa][Pp][Aa][Nn]|[Tt][Oo][Kk][Yy][Oo]|(^|[^A-Za-z])[Jj][Pp]([^A-Za-z]|$)
      interval: 600
      tolerance: 50
      latency_test_url: https://www.gstatic.com/generate_204
  - auto_test:
      name: 韩国节点
      policies:
        - 节点订阅
      flatten: true
      filter: 韩国|韓國|首尔|首爾|🇰🇷|[Kk][Oo][Rr][Ee][Aa]|[Ss][Ee][Oo][Uu][Ll]|(^|[^A-Za-z])[Kk][Rr]([^A-Za-z]|$)
      interval: 600
      tolerance: 50
      latency_test_url: https://www.gstatic.com/generate_204
  - auto_test:
      name: 新加坡节点
      policies:
        - 节点订阅
      flatten: true
      filter: 新加坡|狮城|獅城|🇸🇬|[Ss][Ii][Nn][Gg][Aa][Pp][Oo][Rr][Ee]|(^|[^A-Za-z])[Ss][Gg]([^A-Za-z]|$)
      interval: 600
      tolerance: 50
      latency_test_url: https://www.gstatic.com/generate_204
  - auto_test:
      name: 美国节点
      policies:
        - 节点订阅
      flatten: true
      filter: 美国|美國|🇺🇸|[Uu][Nn][Ii][Tt][Ee][Dd][ -]?[Ss][Tt][Aa][Tt][Ee][Ss]|(^|[^A-Za-z])[Uu][Ss]([Aa])?([^A-Za-z]|$)
      interval: 600
      tolerance: 50
      latency_test_url: https://www.gstatic.com/generate_204
  - select:
      name: 节点订阅
      policies:
        - REJECT
      urls: []
      update_interval: 86400
