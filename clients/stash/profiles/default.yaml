    include-all: true
    filter: 美国|美國|🇺🇸|[Uu][Nn][Ii][Tt][Ee][Dd][ -]?[Ss][Tt][Aa][Tt][Ee][Ss]|(^|[^A-Za-z])[Uu][Ss]([Aa])?([^A-Za-z]|$)
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
