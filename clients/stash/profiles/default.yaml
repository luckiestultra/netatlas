  - name: 香港节点
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: 香港|🇭🇰|[Hh][Oo][Nn][Gg][ _-]?[Kk][Oo][Nn][Gg]|(^|[^A-Za-z])[Hh][Kk]([^A-Za-z]|$)
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
  - name: 台湾节点
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: 台湾|台灣|🇹🇼|[Tt][Aa][Ii][Ww][Aa][Nn]|(^|[^A-Za-z])[Tt][Ww]([^A-Za-z]|$)
    url: https://www.gstatic.com/generate_204
    interval: 300
