proxies: []
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 自动选择
      - 香港节点
      - 台湾节点
      - 日本节点
      - 韩国节点
      - 新加坡节点
      - 美国节点
    include-all: true
  - name: 自动选择
    type: url-test
    proxies:
      - REJECT
    include-all: true
    filter: .+
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
