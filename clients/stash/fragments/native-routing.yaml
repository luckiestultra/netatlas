# NetAtlas native routing fragment. The default and standalone profiles already enable these conditions.
# Merge into a custom profile after explicit service/domain rules and before static CN CIDRs/final.
# This is a manual merge fragment; do not replace a complete profile with it.
# Use Stash's GeoIP database settings for country and ASN databases and refresh.
# No Mihomo-only geox-url or geo-auto-update fields are emitted to Stash.
rule-providers:
  netatlas-china-asn:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/luckiestultra/netatlas/main/clients/stash/rules/china-asn.yaml
    path: ./rules/netatlas-china-asn.yaml
    interval: 86400
  netatlas-geoip-cn:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/luckiestultra/netatlas/main/clients/stash/rules/geoip-cn.yaml
    path: ./rules/netatlas-geoip-cn.yaml
    interval: 86400
rules:
  - RULE-SET,netatlas-china-asn,DIRECT
  - RULE-SET,netatlas-geoip-cn,DIRECT
